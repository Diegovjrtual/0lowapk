name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Capacitor 7
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Criar Android
        run: |
          rm -rf android
          npx cap add android

      - name: Corrigir arquivo do Capacitor
        run: |
          if [ ! -f android/capacitor.settings.gradle ]; then
            echo "Arquivo capacitor.settings.gradle não foi criado."
            echo "Criando arquivo compatível..."
            touch android/capacitor.settings.gradle
          fi

      - name: Copiar site
        run: npx cap copy android

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: 0low-connect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
